[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindcache"
version = "0.1.0"
description = "Structured long-term memory SDK for LLM agents. Beats Mem0 on BEAM benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Devs"}
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "fastembed>=0.2.0",
    "requests>=2.25.0",
    "spacy>=3.0.0",
    "python-dateutil>=2.8.0",
    "litellm>=1.0.0"
]

[project.optional-dependencies]
rerank = [
    "fastembed[rerank]>=0.2.0"
]
optimize = [
    "scikit-learn>=1.0.0",
    "igraph>=0.9.0",
    "leidenalg>=0.8.0"
]

[tool.setuptools]
packages = ["Database", "Memory_extract", "retrieval"]
package-dir = { "" = "." }
